name: Publish LinkCheck source
on:
  push:
    paths:
      - ".github/workflows/publish-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and publish source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="linkcheck-github-ready (1).zip"
          test -f "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/linkcheck-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/linkcheck-source"
          test -f "$RUNNER_TEMP/linkcheck-source/linkcheck/package.json"
          cp -a "$RUNNER_TEMP/linkcheck-source/linkcheck/." .
          rm -f "$ARCHIVE"
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish LinkCheck v0.1.0 source code"
          git push origin HEAD:main
